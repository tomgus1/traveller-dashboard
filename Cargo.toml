[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Release builds are downloaded by players' browsers, often on phones:
# optimise for size. (No `strip`: on WebAssembly it removes the custom
# sections wasm-bindgen needs; wasm-opt drops debug info instead.)
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
