name: Touch Database

# Keeps the free-tier Supabase project from pausing. Fails (and notifies)
# if the database doesn't answer.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily
  workflow_dispatch:

permissions: {}

jobs:
  touch-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # limit=0 keeps the response empty; RLS means the anon key sees no rows
      # anyway. --fail exits non-zero on HTTP errors as well as network errors.
      - name: Touch database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets must be set"
            exit 1
          fi
          status=$(curl -sS --fail --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/campaigns?select=id&limit=0")
          echo "Database touched (HTTP $status)"
