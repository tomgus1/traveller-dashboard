name: CI

# Every push is checked; pushes to main are also deployed to GitHub Pages,
# but only after all checks pass.
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight main build/deploy; superseded branch runs can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm exec vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Each function has its own deno.json, so run from inside its directory.
      - name: Type-check, lint & test
        run: |
          for dir in supabase/functions/*/; do
            echo "::group::$dir"
            (cd "$dir" && deno check index.ts && deno lint && deno test)
            echo "::endgroup::"
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, edge-functions]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-functions:
    name: Deploy Edge Functions
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-functions
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      APP_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed from the release directly: supabase/setup-cli runs npm in the
      # repo, which our devEngines (pnpm only) rejects.
      - name: Install Supabase CLI
        env:
          CLI_VERSION: 2.122.0
        run: |
          base="https://github.com/supabase/cli/releases/download/v$CLI_VERSION"
          file="supabase_${CLI_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" supabase
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve project
        run: |
          # Pages may report http://; the browser origin is always https.
          echo "APP_URL=$(printf '%s' "$APP_URL" | sed -E 's#^http://#https://#')" >> "$GITHUB_ENV"

          # https://<ref>.supabase.co -> <ref>
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not a https://<ref>.supabase.co URL"
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      # Set secrets before deploying so the new code never runs without them.
      - name: Set function secrets
        run: supabase secrets set --project-ref "$PROJECT_REF" APP_URL="$APP_URL"

      - name: Deploy
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
