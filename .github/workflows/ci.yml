name: CI

# Every push is checked; pushes to main are also deployed to GitHub Pages,
# but only after all checks pass.
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-flight main build/deploy; superseded branch runs can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The Dioxus CLI, installed from its GitHub release (checksum verified).
  DX_VERSION: 0.7.10

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml (version, clippy, rustfmt, wasm32).
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Lint (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint (WebAssembly)
        run: cargo clippy -p app --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Applies every migration to a throwaway Postgres (with the live
      # database's drift simulated) and runs the access and import checks.
      - name: Migrations and Row Level Security
        run: TD_EXPORT_DIR="$RUNNER_TEMP/export" database/tests/run.sh

      # The documents the migrations produced must load into the app's types.
      - name: Migrated data loads in Rust
        run: |
          TD_SHEETS_JSONL="$RUNNER_TEMP/export/sheets.jsonl" \
          TD_STATES_JSONL="$RUNNER_TEMP/export/states.jsonl" \
          cargo test -p traveller-model -- backfilled_sheets_load migrated_states_load

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Each function has its own deno.json, so run from inside its directory.
      - name: Type-check, lint & test
        run: |
          for dir in supabase/functions/*/; do
            echo "::group::$dir"
            (cd "$dir" && deno check index.ts && deno lint && deno test)
            echo "::endgroup::"
          done

  build:
    name: Build web app
    needs: [rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Dioxus CLI
        run: |
          base="https://github.com/DioxusLabs/dioxus/releases/download/v$DX_VERSION"
          file="dx-x86_64-unknown-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/dx-x86_64-unknown-linux-gnu.sha256" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" dx
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        working-directory: crates/app
        env:
          # Public by design: Row Level Security protects the data.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: dx build --platform web --release

      # GitHub Pages serves 404.html for any unknown path. Making it the app
      # itself lets direct links (e.g. /traveller-dashboard/campaigns/<id>)
      # open the right page.
      - name: Prepare site
        run: cp target/dx/app/release/web/public/index.html target/dx/app/release/web/public/404.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/dx/app/release/web/public

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, database, edge-functions]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy-functions:
    name: Deploy Edge Functions
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-functions
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      APP_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed from the release directly (checksum verified).
      - name: Install Supabase CLI
        env:
          CLI_VERSION: 2.122.0
        run: |
          base="https://github.com/supabase/cli/releases/download/v$CLI_VERSION"
          file="supabase_${CLI_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" supabase
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve project
        run: |
          # Pages may report http://; the browser origin is always https.
          echo "APP_URL=$(printf '%s' "$APP_URL" | sed -E 's#^http://#https://#')" >> "$GITHUB_ENV"

          # https://<ref>.supabase.co -> <ref>
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not a https://<ref>.supabase.co URL"
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      # Set secrets before deploying so the new code never runs without them.
      - name: Set function secrets
        run: supabase secrets set --project-ref "$PROJECT_REF" APP_URL="$APP_URL"

      - name: Deploy
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
