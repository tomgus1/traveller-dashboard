[package]
name = "app"
version = "0.1.0"
description = "Traveller Dashboard web app (Dioxus, WebAssembly)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
traveller-rules = { path = "../traveller-rules" }
dioxus = { version = "=0.7.10", features = ["web", "router"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
gloo-storage = "=0.4.0"
js-sys = "=0.3.106"
thiserror = "=2.0.21"

[lints]
workspace = true
