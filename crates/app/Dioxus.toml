[application]
out_dir = "dist"

[web.app]
title = "Traveller Dashboard"
# Served from https://<host>/traveller-dashboard/ on GitHub Pages.
base_path = "traveller-dashboard"

[web.watcher]
index_on_404 = true
watch_path = ["src", "assets"]

[web.wasm_opt]
# Optimise release builds for size (smaller download at the table).
level = "z"
