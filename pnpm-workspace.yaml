# pnpm settings (single-package repo; no workspace packages)

# Dependency install scripts are denied unless listed true here. These three ship
# prebuilt binaries via optional deps, so their scripts aren't needed.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false

# Supply-chain hardening: don't install versions published less than a day ago.
minimumReleaseAge: 1440

# Carried over from npm "overrides" to silence deprecated transitive deps of exceljs/jest.
overrides:
  glob: ^10.4.5
  rimraf: ^5.0.10
